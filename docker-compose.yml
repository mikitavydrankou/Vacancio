services:
  vacancio:
    image: ghcr.io/mikitavydrankou/vacancio:latest
    container_name: vacancio
    ports:
      - "3000:3000"
      # Optional: expose the API directly for Swagger docs at http://localhost:8000/docs
      # - "8000:8000"
    volumes:
      - vacancio-data:/app/server/data
    environment:
      # Optional — you can also set the key from the in-app Settings.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    restart: unless-stopped

volumes:
  vacancio-data:
